name: Build Whyred KSUN + SUSFS

on:
  workflow_dispatch: # Memungkinkan dijalankan manual lewat tombol

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

      - name: 2. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android-4.4-stable
          fetch-depth: 1

      - name: 3. Integrasi KernelSU-Next (KSUN) & Patch SUSFS
        run: |
          # Pasang KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # Terapkan patch SUSFS v1.5.5 ke dalam folder KernelSU-Next
          cd KernelSU-Next
          git apply ../ksu_susfs.patch
          cd ..

      - name: 4. Integrasi Core SUSFS ke Kernel 4.4
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.4 --depth=1 susfs4ksu
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          # Terapkan patch VFS kernel 4.4 dari susfs4ksu (menggunakan --3way agar meminimalkan konflik)
          git apply --3way susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.4.patch || true

      - name: 5. Aktifkan Konfigurasi KSUN & SUSFS di Defconfig
        run: |
          DEFCONFIG="arch/arm64/configs/whyred_defconfig"
          # Jika nama defconfig di repo berbeda (misal vendor/whyred_defconfig), sesuaikan jalurnya
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "*whyred*" | head -n 1)
          fi
          echo "Menggunakan defconfig: $DEFCONFIG"
          
          cat << 'EOF' >> "$DEFCONFIG"
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF

      - name: 6. Download Toolchain (Clang & GCC) & Compile
        run: |
          git clone https://github.com/ZyCromerZ/Clang -b 14.0 --depth=1 clang
          export PATH="$PWD/clang/bin:$PATH"
          
          DEFCONFIG_NAME=$(cd arch/arm64/configs && find . -name "*whyred*" | sed 's|./||;q')
          make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: 7. Bungkus ke AnyKernel3 (.zip)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          sed -i 's/device.name1=.*/device.name1=whyred/' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../SanKernel-Whyred-KSUN-SUSFS-1.5.5.zip * -x .git README.md *placeholder

      - name: 8. Upload Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Whyred-KSUN-SUSFS
          path: SanKernel-Whyred-KSUN-SUSFS-1.5.5.zip
